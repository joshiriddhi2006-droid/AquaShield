<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register Complaint — Aquashield</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Register Complaint</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="complaint.html">Register Complaint</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <main class="container">
    <form id="complaint-form" class="card">
      <label>Title<input name="title" required></label>
      <label>Description<textarea name="description" rows="4" required></textarea></label>
      <label>Location<input name="location"></label>
      <label>Evidence (images)
        <input id="evidence" type="file" accept="image/*" multiple>
      </label>
      <div id="preview" class="preview"></div>
      <div class="form-actions">
        <button type="submit" class="btn">Submit Complaint</button>
      </div>
    </form>

    <section>
      <h3>Track by ID</h3>
      <div id="track-result">Enter a complaint to get an ID.</div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/complaint.js"></script>
</body>
</html>
